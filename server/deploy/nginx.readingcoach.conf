server {
    listen 80;
    listen [::]:80;
    server_name readingcoach.jingjiangke.com;

    # 将所有 HTTP 请求重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name readingcoach.jingjiangke.com;

    # 通配符证书 *.jingjiangke.com（certbot DNS-01 申请）
    ssl_certificate     /etc/letsencrypt/live/jingjiangke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jingjiangke.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 拍照 OCR 会上传较大图片
    client_max_body_size 20m;

    # Web 文章录入静态资源（console/web 构建产物）
    root /home/website/readingcoach.jingjiangke.com/www/console;
    index index.html;

    # Go API（现有 Docker 容器映射宿主机 8080）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OCR / AI 拆句较慢，放宽超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 健康检查（可选，供监控探活）
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA 路由：/articles、/login 等由前端接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}
